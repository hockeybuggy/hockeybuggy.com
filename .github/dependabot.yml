version: 2

updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: monthly
      time: "10:00"
    open-pull-requests-limit: 10
    cooldown:
      default-days: 7

  - package-ecosystem: cargo
    directory: "/ssg"
    schedule:
      interval: monthly
      time: "10:00"
    open-pull-requests-limit: 10
    cooldown:
      default-days: 7

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
      time: "10:00"
    open-pull-requests-limit: 10
    cooldown:
      default-days: 7

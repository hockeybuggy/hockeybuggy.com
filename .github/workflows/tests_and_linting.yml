name: tests

on: [push]

jobs:
  rust-checks:
    runs-on: ubuntu-22.04
    steps:
    - uses: actions/checkout@v5
    - uses: ./.github/actions/rust-setup
      with:
        components: rustfmt, clippy
    - name: cargo fmt
      run: cargo fmt --manifest-path ssg/Cargo.toml --check
    - name: cargo clippy
      run: cargo clippy --manifest-path ssg/Cargo.toml --all-targets -- -D warnings
    - name: cargo test
      run: cargo test --manifest-path ssg/Cargo.toml


  build:
    runs-on: ubuntu-22.04
    steps:
    - uses: actions/checkout@v5
    - uses: ./.github/actions/build-site


  run-end-to-end-tests:
    needs: build
    runs-on: ubuntu-22.04
    steps:
    - uses: actions/checkout@v5
    - uses: ./.github/actions/shared-setup
    - uses: ./.github/actions/build-site
    - name: Install Playwright browsers
      run: yarn playwright install --with-deps chromium
    - name: Run Tests
      env:
        CI: true
      run: |
        yarn run test:e2e
    - name: Test Cloudflare routing
      run: yarn test:cloudflare
    - uses: actions/upload-artifact@v5
      if: always()
      with:
        name: playwright-report
        path: |
          playwright-report/
          e2e_tests/screenshots/


  link-check:
    needs: build
    # ubuntu-24.04 (glibc 2.39): the unpinned lychee release now requires a
    # newer glibc than ubuntu-22.04 (glibc 2.35) provides.
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v5
    - uses: ./.github/actions/build-site
    - name: Check internal links
      uses: lycheeverse/lychee-action@v2
      with:
        args: >-
          --offline --no-progress
          --root-dir ${{ github.workspace }}/dist
          --config lychee.toml
          './dist/**/*.html'
        fail: true


  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [rust-checks, build, run-end-to-end-tests, link-check]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    concurrency:
      group: cloudflare-production
      cancel-in-progress: false
    outputs:
      deployed: ${{ steps.revision.outputs.current }}
    steps:
    - uses: actions/checkout@v5
    - uses: ./.github/actions/shared-setup
    - uses: ./.github/actions/build-site
    - name: Check deployment revision
      id: revision
      shell: bash
      run: |
        latest_sha=$(git ls-remote origin refs/heads/main | cut -f1)
        if [ "$latest_sha" = "$GITHUB_SHA" ]; then
          echo "current=true" >> "$GITHUB_OUTPUT"
        else
          echo "Skipping deployment: main has a newer commit." >> "$GITHUB_STEP_SUMMARY"
        fi
    - name: Deploy to Cloudflare
      if: steps.revision.outputs.current == 'true'
      env:
        CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        WRANGLER_SEND_METRICS: "false"
      run: |
        test -n "$CLOUDFLARE_API_TOKEN"
        if [ "$CLOUDFLARE_ACCOUNT_ID" != "726f1369a47436d0572ed49705aaf86a" ]; then
          echo "::error::CLOUDFLARE_ACCOUNT_ID does not match the production account."
          exit 1
        fi
        yarn wrangler deployments list --name hockeybuggy
        yarn wrangler deploy


  notify-deploy:
    if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [rust-checks, build, run-end-to-end-tests, link-check, deploy]
    runs-on: ubuntu-24.04
    permissions: {}
    steps:
    - name: Post to #prj-hockeybuggy-com
      env:
        WEBHOOK_URL: ${{ secrets.DISCORD_DEPLOY_WEBHOOK_URL }}
        NEEDS: ${{ toJSON(needs) }}
        DEPLOYED: ${{ needs.deploy.outputs.deployed }}
        COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        COMMIT_URL: ${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}
        RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      run: |
        test -n "$WEBHOOK_URL"
        failed=$(jq -r '[to_entries[] | select(.value.result == "failure" or .value.result == "cancelled") | .key] | join(", ")' <<<"$NEEDS")
        commit="[${GITHUB_SHA::7}]($COMMIT_URL)"
        if [ -n "$failed" ]; then
          content="🔴 Deploy of $commit failed at \`$failed\` · [run]($RUN_URL)"
        elif [ "$DEPLOYED" = "true" ]; then
          content="🚀 Deployed $commit — ${COMMIT_MESSAGE%%$'\n'*} · [run]($RUN_URL)"
        else
          exit 0
        fi
        # flags 4 suppresses link embeds, so each deploy stays one line.
        jq -n --arg content "$content" '{content: $content, flags: 4, allowed_mentions: {parse: []}}' \
          | curl -fsS -H 'Content-Type: application/json' --data @- "$WEBHOOK_URL"
